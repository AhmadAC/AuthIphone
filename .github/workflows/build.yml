name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # NEW STEP: Automatically organizes your files so Capacitor can find them
      - name: Prepare Web Assets
        run: |
          mkdir -p src
          if [ -f "index.html" ]; then cp index.html src/index.html; fi
          if [ -f "icon.png" ]; then cp icon.png src/icon.png; fi

      - name: Install Dependencies
        run: npm install

      - name: Initialize Capacitor iOS
        run: npx cap add ios

      - name: Sync iOS Project
        run: npx cap sync ios

      - name: Build Unsigned iOS App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          mv ios/App/build/Release-iphoneos/App.app Payload/
          zip -r 2FA-App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2FA-App-IPA
          path: 2FA-App.ipa